name: AmneziaClient
options:
  bundleIdPrefix: com.oktayibis.awgconnect
  deploymentTarget:
    iOS: "16.0"
    macOS: "14.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 3SN795A9D6
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AmneziaCore:
    type: framework
    platform: iOS
    sources:
      - path: AmneziaCore
    info:
      path: AmneziaCore/Info.plist
      properties:
        CFBundlePackageType: FMWK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oktayibis.awgconnect.core
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - sdk: libz.tbd
      - sdk: Network.framework
      - sdk: NetworkExtension.framework

  AmneziaApp:
    type: application
    platform: iOS
    sources:
      - path: AmneziaApp
    info:
      path: AmneziaApp/Info.plist
      properties:
        CFBundleDisplayName: "AWG Connect"
        NSCameraUsageDescription: "AWG Connect requires camera access to scan VPN configuration QR codes."
        NSPhotoLibraryUsageDescription: "AWG Connect requires photo library access to import QR code images."
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.oktayibis.awgconnect
            CFBundleURLSchemes:
              - vpn
              - awgconnect
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: AmneziaApp/AmneziaApp.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oktayibis.awgconnect
        PRODUCT_NAME: "AWG Connect"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: AmneziaCore
      - target: AmneziaTunnel
      - sdk: AVFoundation.framework
      - sdk: Vision.framework
      - sdk: PhotosUI.framework

  AmneziaTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: AmneziaTunnel
    info:
      path: AmneziaTunnel/Info.plist
      properties:
        CFBundleDisplayName: "AWG Connect Tunnel"
        CFBundlePackageType: "XPC!"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: AmneziaTunnel/AmneziaTunnel.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oktayibis.awgconnect.tunnel
        PRODUCT_NAME: "AmneziaTunnel"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: AmneziaCore
      - sdk: NetworkExtension.framework

  AmneziaCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AmneziaCoreTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AmneziaCore

  AmneziaCoreMac:
    type: framework
    platform: macOS
    sources:
      - path: AmneziaCore
    info:
      path: AmneziaCore/Info.plist
      properties:
        CFBundlePackageType: FMWK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oktayibis.awgconnect.core.mac
        PRODUCT_NAME: AmneziaCore
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - sdk: libz.tbd
      - sdk: Network.framework
      - sdk: NetworkExtension.framework

  AmneziaMac:
    type: application
    platform: macOS
    sources:
      - path: AmneziaMac
    info:
      path: AmneziaMac/Info.plist
      properties:
        CFBundleDisplayName: "AWG Connect"
        CFBundleName: "AWG Connect"
        LSApplicationCategoryType: "public.app-category.utilities"
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.oktayibis.awgconnect.mac
            CFBundleURLSchemes:
              - vpn
              - awgconnect
    entitlements:
      path: AmneziaMac/AmneziaMac.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oktayibis.awgconnect.mac
        PRODUCT_NAME: "AWG Connect"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: AmneziaCoreMac
      - target: AmneziaTunnelMac
      - sdk: Network.framework
      - sdk: NetworkExtension.framework
      - sdk: AppKit.framework
      - sdk: UniformTypeIdentifiers.framework

  AmneziaTunnelMac:
    type: app-extension
    platform: macOS
    sources:
      - path: AmneziaTunnel
    info:
      path: AmneziaTunnel/Info.plist
      properties:
        CFBundleDisplayName: "AWG Connect Tunnel"
        CFBundlePackageType: "XPC!"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: AmneziaTunnel/AmneziaTunnelMac.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oktayibis.awgconnect.mac.tunnel
        PRODUCT_NAME: "AmneziaTunnelMac"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: AmneziaCoreMac
      - sdk: NetworkExtension.framework

schemes:
  AmneziaApp:
    build:
      targets:
        AmneziaApp: all
        AmneziaCore: all
        AmneziaTunnel: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AmneziaCoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  AmneziaMac:
    build:
      targets:
        AmneziaMac: all
        AmneziaCoreMac: all
        AmneziaTunnelMac: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
